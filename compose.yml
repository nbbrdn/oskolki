name: oskolkicelogo

services:

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ghost
      - grampsweb
      - remark42

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  ghost:
    image: ghost:6-alpine
    restart: unless-stopped
    environment:
      NODE_ENV: production

      url: https://oskolkicelogo.ru

      database__client: mysql
      database__connection__host: mysql
      database__connection__port: 3306
      database__connection__user: ghost
      database__connection__password: ${MYSQL_PASSWORD}
      database__connection__database: ghost

    volumes:
      - ghost_content:/var/lib/ghost/content

    depends_on:
      mysql:
        condition: service_healthy


  grampsweb:
    image: ghcr.io/gramps-project/grampsweb:latest
    restart: unless-stopped

    environment: &gramps_environment
      GRAMPSWEB_TREE: "Bayborodin"
      GRAMPSWEB_BASE_URL: "https://tree.oskolkicelogo.ru"

      GRAMPSWEB_REGISTRATION_DISABLED: "true"
      GRAMPSWEB_DISABLE_TELEMETRY: "true"

      GUNICORN_NUM_WORKERS: "2"

      GRAMPSWEB_CELERY_CONFIG__broker_url: "redis://grampsweb_redis:6379/0"
      GRAMPSWEB_CELERY_CONFIG__result_backend: "redis://grampsweb_redis:6379/0"
      GRAMPSWEB_RATELIMIT_STORAGE_URI: "redis://grampsweb_redis:6379/1"

    volumes: &gramps_volumes
      - gramps_users:/app/users
      - gramps_index:/app/indexdir
      - gramps_thumb_cache:/app/thumbnail_cache
      - gramps_cache:/app/cache
      - gramps_secret:/app/secret
      - gramps_db:/root/.gramps/grampsdb
      - gramps_media:/app/media
      - gramps_tmp:/tmp

    depends_on:
      - grampsweb_redis


  grampsweb_celery:
    image: ghcr.io/gramps-project/grampsweb:latest
    restart: unless-stopped

    environment:
      <<: *gramps_environment

    volumes:
      *gramps_volumes

    depends_on:
      - grampsweb_redis

    command:
      celery -A gramps_webapi.celery worker --loglevel=INFO --concurrency=1


  grampsweb_redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped

  remark42:
    image: ghcr.io/umputun/remark42:latest
    container_name: remark42
    restart: unless-stopped

    environment:
      REMARK_URL: "https://oskolkicelogo.ru/remark42"
      SITE: "oskolkicelogo"
      SECRET: "${REMARK42_SECRET}"

      # Разрешаем комментирование без регистрации
      AUTH_ANON: "true"

      # Remark42 работает на том же домене
      AUTH_SAME_SITE: "strict"
      ALLOWED_HOSTS: "'self'"

      # Русский интерфейс зададим также на frontend
      MAX_COMMENT_SIZE: "8192"
      EMOJI: "true"

      # Caddy работает внутри Docker-сети
      TRUSTED_PROXY: "172.31.42.0/24"

    volumes:
      - remark42_data:/srv/var

    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:

  caddy_data:
  caddy_config:

  mysql_data:
  ghost_content:

  remark42_data:

  gramps_users:
  gramps_index:
  gramps_thumb_cache:
  gramps_cache:
  gramps_secret:
  gramps_db:
  gramps_media:
  gramps_tmp:

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.42.0/24
