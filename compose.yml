name: oskolkicelogo

services:

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ghost
      - remark42

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  ghost:
    image: ghost:6-alpine
    restart: unless-stopped
    environment:
      NODE_ENV: production

      url: https://oskolkicelogo.ru

      database__client: mysql
      database__connection__host: mysql
      database__connection__port: 3306
      database__connection__user: ghost
      database__connection__password: ${MYSQL_PASSWORD}
      database__connection__database: ghost

    volumes:
      - ghost_content:/var/lib/ghost/content

    depends_on:
      mysql:
        condition: service_healthy

  remark42:
    image: ghcr.io/umputun/remark42:latest
    container_name: remark42
    restart: unless-stopped

    environment:
      REMARK_URL: "https://oskolkicelogo.ru/remark42"
      SITE: "oskolkicelogo"
      SECRET: "${REMARK42_SECRET}"

      # Разрешаем комментирование без регистрации
      AUTH_ANON: "true"

      # Remark42 работает на том же домене
      AUTH_SAME_SITE: "strict"
      ALLOWED_HOSTS: "'self'"

      # Русский интерфейс зададим также на frontend
      MAX_COMMENT_SIZE: "8192"
      EMOJI: "true"

      # Caddy работает внутри Docker-сети
      TRUSTED_PROXY: "172.31.42.0/24"

      # Прокси для Telegram
      HTTPS_PROXY: "http://10.7.0.1:3128"
      HTTP_PROXY: "http://10.7.0.1:3128"

      NO_PROXY: >-
        localhost,
        127.0.0.1,
        ::1,
        ghost,
        mysql,
        remark42,
        oskolkicelogo.ru

    volumes:
      - remark42_data:/srv/var

    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:

  caddy_data:
  caddy_config:

  mysql_data:
  ghost_content:

  remark42_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.42.0/24
